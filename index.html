<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SURFJAVAREXXA Merch Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-navy: #0b1524;          /* 深午夜藍主背景 */
      --stage-navy: #112036;       /* 陳列展示台深藍底 */
      --stage-border: #1d3557;     /* 展示台細微藍框 */
      --text-white: #f4f7fb;
      --text-muted: #93a8c4;
      --surf-teal: #57c5c1;        /* 薄荷藍綠 (Surf) */
      --surf-teal-dark: #156e6b;   /* 深薄荷橫幅底 */
      --java-caramel: #be7b3a;     /* 焦糖暖棕 (Java) */
      --rexxa-mint: #73dcd3;       /* REXXA 專屬薄荷青綠 */
      --card-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-navy);
      background-image: radial-gradient(circle at 50% 0%, #152845 0%, #0b1524 65%);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      padding-bottom: 90px;
    }

    /* 1. 頂部主視覺標題區 */
    header {
      text-align: center;
      padding: 46px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-wrapper {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .main-title {
      position: relative;
      font-size: clamp(2.1rem, 7.6vw, 5.2rem);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 0.95;
      text-transform: uppercase;
      user-select: none;
      display: inline-flex;
      align-items: center;
    }

    .title-surf {
      color: var(--surf-teal);
      text-shadow: 0 0 22px rgba(87, 197, 193, 0.35);
    }

    .title-java {
      color: var(--java-caramel);
      text-shadow: 0 0 22px rgba(190, 123, 58, 0.35);
    }

    .title-rexxa {
      color: var(--rexxa-mint);
      text-shadow: 0 0 22px rgba(115, 220, 211, 0.4);
    }

    .rexxa-mascot-icon {
      width: clamp(28px, 4.2vw, 48px);
      height: auto;
      margin-left: 6px;
      margin-top: -0.55em;
      filter: drop-shadow(0 0 10px rgba(115, 220, 211, 0.7));
      transform: rotate(8deg);
      flex-shrink: 0;
    }

    .sub-script {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.35rem, 3.8vw, 2.7rem);
      color: #ffffff;
      letter-spacing: 1px;
      margin-top: -0.22em;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.95),
        0 0 18px rgba(115, 220, 211, 0.85),
        0 0 28px rgba(87, 197, 193, 0.6),
        0 3px 10px rgba(0, 0, 0, 0.9);
      transform: rotate(-1.5deg);
      pointer-events: none;
    }

    /* 2. 焦糖暖棕公告欄 */
    .notice-bar {
      background-color: var(--java-caramel);
      color: #ffffff;
      padding: 18px 10%;
      font-size: 0.85rem;
      line-height: 1.65;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .notice-bar h3 {
      font-size: 1.05rem;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .notice-bar ul {
      padding-left: 18px;
    }

    .notice-bar li {
      margin-bottom: 3px;
    }

    /* 3. 滿版薄荷藍綠 ≡ MENU 導覽列 */
    .menu-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(4, 10, 20, 0.65);
    }

    .menu-header-bar {
      background-color: var(--surf-teal);
      color: #ffffff;
      padding: 13px 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .menu-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    .menu-quick-stats {
      font-size: 0.8rem;
      font-weight: 900;
      background-color: var(--bg-navy);
      color: var(--surf-teal);
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(87, 197, 193, 0.4);
    }

    .menu-drawer {
      background-color: #0e1b2e;
      border-bottom: 2px solid var(--surf-teal);
      padding: 14px 10%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-drawer.collapsed {
      display: none;
    }

    .drawer-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-white);
      border: 1.5px solid var(--surf-teal);
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.18s;
      text-transform: uppercase;
    }

    .btn:hover, .btn.active {
      background: var(--surf-teal);
      color: var(--bg-navy);
    }

    .btn-caramel {
      background: var(--java-caramel);
      border-color: var(--java-caramel);
      color: #ffffff;
    }

    .btn-caramel:hover {
      background: #9f642b;
      border-color: #9f642b;
    }

    .btn-outline-caramel {
      border-color: var(--java-caramel);
      color: #e69d56;
    }

    .btn-outline-caramel:hover, .btn-outline-caramel.active {
      background: var(--java-caramel);
      color: #ffffff;
    }

    .event-select {
      background-color: var(--bg-navy);
      color: #ffffff;
      border: 1.5px solid var(--surf-teal);
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.7rem;
      max-width: 260px;
      cursor: pointer;
    }

    /* 4. 內容容器與圖例說明 */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .legend-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      padding: 22px 0 16px;
      gap: 24px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .box-sample {
      width: 22px;
      height: 32px;
      border-radius: 5px;
      background-color: var(--stage-navy);
    }

    .box-random {
      border: 1.5px solid var(--surf-teal);
    }

    .box-secret {
      border: 2px solid transparent;
      background:
        linear-gradient(var(--stage-navy), var(--stage-navy)) padding-box,
        linear-gradient(135deg, #57c5c1 0%, #a8f5f2 35%, #f5b97d 65%, #be7b3a 100%) border-box;
      box-shadow: -3px 0 10px rgba(87, 197, 193, 0.75), 3px 0 10px rgba(190, 123, 58, 0.75);
    }

    .txt-teal { color: var(--surf-teal); }
    .txt-caramel { color: #e69d56; }

    /* 5. 官方型錄展示區塊 */
    .event-section {
      margin-bottom: 46px;
      scroll-margin-top: 72px;
      background-color: var(--stage-navy);
      border: 1px solid var(--stage-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(4, 10, 20, 0.45);
    }

    .catalog-header {
      background: repeating-linear-gradient(
        45deg,
        rgba(87, 197, 193, 0.14),
        rgba(87, 197, 193, 0.14) 12px,
        rgba(17, 32, 54, 0.6) 12px,
        rgba(17, 32, 54, 0.6) 24px
      );
      border-bottom: 2px solid rgba(87, 197, 193, 0.35);
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .pill-sub-banner {
      background-color: var(--java-caramel);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      padding: 4px 20px;
      border-radius: 20px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .main-event-bar {
      background-color: var(--surf-teal-dark);
      border: 1.5px solid var(--surf-teal);
      color: #ffffff;
      font-size: clamp(0.95rem, 2.3vw, 1.25rem);
      font-weight: 900;
      letter-spacing: 1px;
      padding: 10px 26px;
      border-radius: 10px;
      margin-top: -6px;
      width: 100%;
      max-width: 720px;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* 6. 無邊框懸浮商品陳列台 */
    .catalog-stage {
      padding: 26px 24px 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 24px 18px;
      align-items: end;
    }

    .showcase-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .showcase-item:hover {
      transform: translateY(-4px);
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 5.5 / 8.5; /* 小卡 / 明信片比例 */
      border-radius: var(--card-radius);
      overflow: hidden;
      background-color: #0d192b;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .showcase-item.is-square .img-wrapper {
      aspect-ratio: 1 / 1; /* 周邊與扭蛋 1:1 比例 */
    }

    .showcase-item.type-random .img-wrapper {
      border-color: var(--surf-teal);
    }

    /* 隱藏卡 (Secret Card)：雙邊亮框發光特效 */
    .showcase-item.type-secret .img-wrapper {
      border: 2.5px solid transparent;
      background:
        linear-gradient(#0d192b, #0d192b) padding-box,
        linear-gradient(125deg, #47dcd7 0%, #b5faf7 30%, #ffd2a6 70%, #d47f2a 100%) border-box;
      box-shadow:
        -5px 0 16px rgba(87, 197, 193, 0.72),
        5px 0 16px rgba(190, 123, 58, 0.72),
        0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .showcase-item.type-secret:hover .img-wrapper {
      box-shadow:
        -7px 0 22px rgba(87, 197, 193, 0.95),
        7px 0 22px rgba(190, 123, 58, 0.95),
        0 10px 24px rgba(0, 0, 0, 0.6);
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.2s, opacity 0.2s;
    }

    .secret-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: linear-gradient(90deg, var(--surf-teal), var(--java-caramel));
      color: #ffffff;
      font-size: 0.58rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .showcase-title {
      margin-top: 10px;
      font-size: 0.74rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .showcase-link {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1.5px dashed rgba(87, 197, 193, 0.65);
      padding-bottom: 1px;
      transition: color 0.18s, border-color 0.18s;
    }

    .showcase-link:hover {
      color: var(--surf-teal);
      border-bottom-style: solid;
      border-bottom-color: var(--surf-teal);
    }

    .showcase-link::after {
      content: " ↗";
      font-size: 0.68rem;
      color: var(--surf-teal);
    }

    .showcase-type {
      margin-top: 4px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .cat-photocard { color: var(--surf-teal); }
    .cat-postcard  { color: var(--rexxa-mint); }
    .cat-gasha     { color: #f2b06d; }
    .cat-merch     { color: #e69d56; }

    /* 點擊圖片標記「已擁有」狀態 */
    .showcase-item.owned .img-wrapper img {
      filter: grayscale(85%) brightness(42%);
    }

    .showcase-item.owned .img-wrapper::after {
      content: "✓ OWNED";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-10deg);
      background-color: var(--java-caramel);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 5px 10px;
      border-radius: 6px;
      border: 2px solid #ffffff;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: var(--surf-teal);
      color: var(--bg-navy);
      font-weight: 900;
      font-size: 0.82rem;
      padding: 10px 22px;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .notice-bar, .menu-header-bar, .menu-drawer { padding-left: 6%; padding-right: 6%; }
      .catalog-header { padding: 14px 12px; }
      .pill-sub-banner { font-size: 0.6rem; padding: 3px 14px; }
      .main-event-bar { font-size: 0.88rem; padding: 8px 14px; }
      .catalog-stage { padding: 18px 14px 22px; grid-template-columns: repeat(2, 1fr); gap: 18px 12px; }
    }
  </style>
</head>

  <!-- 1. 頂部主視覺標題區 -->
  <header>
    <div class="title-wrapper">
      <div class="main-title">
        <span class="title-surf">SURF</span><span class="title-java">JAVA</span><span class="title-rexxa">REXXA</span>

  </section>

  <!-- 3. 滿版薄荷藍綠 ≡ MENU 導覽列 -->
  <nav class="menu-wrapper">
    <div class="menu-header-bar" onclick="toggleMenuDrawer()">
      <span class="menu-toggle-btn">≡ MENU</span>
      <span class="menu-quick-stats" id="stats-badge">OWNED: 0 / 0 (0%)</span>
    </div>
    <div class="menu-drawer" id="menu-drawer">
      <div class="drawer-row">

          <button class="btn" onclick="switchCategory('POSTCARD', this)">POSTCARD (明信片)</button>
          <button class="btn" onclick="switchCategory('GASHA', this)">GASHA (扭蛋)</button>
          <button class="btn" onclick="switchCategory('MERCH', this)">OFFICIAL MERCH (周邊)</button>
        </div>
        <div class="btn-group">
          <select class="event-select" id="event-jump" onchange="jumpToEvent(this.value)">
            <option value="">JUMP TO EVENT (快速跳轉)...</option>
          </select>
          <button class="btn" onclick="copyMissingList()">EXPORT MISSING</button>
          <button class="btn btn-caramel" onclick="resetProgress()">RESET</button>
        </div>
      </div>
      <div class="drawer-row">
        <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700;">點圖片＝標記已擁有 ｜ 點文字＝前往官網購買頁</span>
        <button class="btn btn-outline-caramel" id="missing-btn" onclick="toggleMissingOnly(this)">ONLY MISSING (僅看未擁有)</button>
      </div>
    </div>
  </nav>

  <!-- 4. 主要內容區 -->
  <main class="container">
    <div class="legend-section">
      <div class="legend-item">
        <div class="box-sample box-random"></div>
        <span class="txt-teal">PHOTOCARD / RANDOM CARD</span>
      </div>
      <div class="legend-item">
        <div class="box-sample box-secret"></div>
        <span class="txt-caramel">SECRET / SPECIAL CARD (雙色亮框)</span>
      </div>
    </div>

    <!-- 動態渲染 15 大活動型錄展示區 -->
    <div id="archive-container"></div>
  </main>

    const STORAGE_KEY = "surfjava_archive_owned_v4";
    let ownedIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentCategory = "ALL";
    let onlyMissing = false;

    function initEventJumpSelect() {
      const select = document.getElementById("event-jump");
      ARCHIVE_DATA.forEach(evt => {
        const opt = document.createElement("option");
        opt.value = evt.eventId;
        opt.textContent = evt.eventTitle;
        select.appendChild(opt);
      });
    }

    function jumpToEvent(eventId) {
      if (!eventId) return;
      const el = document.getElementById(eventId);
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }

    function toggleMenuDrawer() {
      document.getElementById("menu-drawer").classList.toggle("collapsed");
    }

    function switchCategory(category, btnEl) {
      currentCategory = category;
      btnEl.parentElement.querySelectorAll(".btn").forEach(btn => btn.classList.remove("active"));
      btnEl.classList.add("active");
      renderArchive();
    }

    function toggleMissingOnly(btnEl) {
      onlyMissing = !onlyMissing;
      btnEl.classList.toggle("active", onlyMissing);
      renderArchive();
    }

    function toggleOwned(itemId) {
      if (ownedIds.has(itemId)) {
        ownedIds.delete(itemId);
      } else {
        ownedIds.add(itemId);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...ownedIds]));
      renderArchive();
    }

    function resetProgress() {
      if (confirm("確定要清空所有「已擁有」的收集紀錄嗎？")) {
        ownedIds.clear();
        localStorage.removeItem(STORAGE_KEY);
        renderArchive();
        showToast("已重置所有收集進度");
      }
    }

    function copyMissingList() {
      const missingLines = [];
      ARCHIVE_DATA.forEach(evt => {
        const filtered = evt.items.filter(item => {
          if (currentCategory !== "ALL" && item.category !== currentCategory) return false;
          return !ownedIds.has(item.id);
        });
        if (filtered.length > 0) {
          missingLines.push(`【${evt.eventTitle}】`);
          filtered.forEach(i => missingLines.push(`- [${i.category}] ${i.title}`));
        }
      });

      const text = missingLines.length > 0
        ? "SURFJAVAREXXA 缺物清單：\n" + missingLines.join("\n")
        : "恭喜！目前篩選條件下的項目已全部收集完成！";

      navigator.clipboard.writeText(text).then(() => {
        showToast(missingLines.length > 0 ? "已複製缺物清單到剪貼簿！" : "已全部收集完成！");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function renderArchive() {
      const container = document.getElementById("archive-container");
      container.innerHTML = "";

      let totalVisible = 0;
      let ownedVisible = 0;

      ARCHIVE_DATA.forEach(evt => {
        const categoryItems = evt.items.filter(item => {
          return currentCategory === "ALL" || item.category === currentCategory;
        });

        if (categoryItems.length === 0) return;

        totalVisible += categoryItems.length;
        ownedVisible += categoryItems.filter(i => ownedIds.has(i.id)).length;

        const displayItems = onlyMissing
          ? categoryItems.filter(item => !ownedIds.has(item.id))
          : categoryItems;

        if (displayItems.length === 0) return;

        const section = document.createElement("section");
        section.className = "event-section";
        section.id = evt.eventId;

        section.innerHTML = `
          <div class="catalog-header">
            <div class="pill-sub-banner">${evt.subLabel || "GMMTV OFFICIAL MERCHANDISE"}</div>
            <div class="main-event-bar">${evt.eventTitle}</div>
          </div>
        `;

        const stage = document.createElement("div");
        stage.className = "catalog-stage";

        displayItems.forEach(item => {
          const isOwned = ownedIds.has(item.id);
          const isSquare = item.category === "MERCH" || item.category === "GASHA";

          const card = document.createElement("div");
          card.className = [
            "showcase-item",
            isSquare ? "is-square" : "",
            `type-${item.type}`,
            isOwned ? "owned" : ""
          ].filter(Boolean).join(" ");

          const secretTagHtml = item.type === "secret"
            ? `<span class="secret-badge">SECRET</span>`
            : "";

          const titleHtml = item.url && item.url.trim() !== ""
            ? `<a class="showcase-link" href="${item.url}" target="_blank" rel="noopener noreferrer" title="前往官方購買頁面">${item.title}</a>`
            : item.title;

          const catClass = `cat-${item.category.toLowerCase()}`;

          card.innerHTML = `
            <div class="img-wrapper" onclick="toggleOwned('${item.id}')" title="點擊圖片標記已擁有">
              ${secretTagHtml}
              <img src="${item.img}" alt="${item.title}" loading="lazy">
            </div>
            <div class="showcase-title">${titleHtml}</div>
            <div class="showcase-type ${catClass}">${item.category}</div>
          `;
          stage.appendChild(card);
        });

        section.appendChild(stage);
        container.appendChild(section);
      });

      const percent = totalVisible > 0 ? Math.round((ownedVisible / totalVisible) * 100) : 0;
      document.getElementById("stats-badge").textContent = `OWNED: ${ownedVisible} / ${totalVisible} (${percent}%)`;
    }

    initEventJumpSelect();
    renderArchive();
  </script>
